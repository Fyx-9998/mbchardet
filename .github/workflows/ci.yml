name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain this repository is formatted and tested with. Update it
  # deliberately: newer releases may format code differently. Versioned
  # downloads on cli.moonbitlang.com are deleted about 60 days after release,
  # so this pin has to move forward before then.
  MOONBIT_INSTALL_VERSION: "0.10.17+093cb8f9c"

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC (Windows native backend)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Toolchain version
        run: moon version --all

      - name: Format check
        run: moon fmt --check

      - name: Interface files are up to date
        shell: bash
        run: |
          moon info
          git diff --exit-code

      - name: Check wasm
        run: moon check --deny-warn --target wasm
      - name: Check wasm-gc
        run: moon check --deny-warn --target wasm-gc
      - name: Check js
        run: moon check --deny-warn --target js
      - name: Check native
        run: moon check --deny-warn --target native

      - name: Test wasm
        run: moon test --target wasm
      - name: Test wasm-gc
        run: moon test --target wasm-gc
      - name: Test js
        run: moon test --target js
      - name: Test native
        run: moon test --target native

  chardetng-data:
    name: chardetng data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Regenerate the golden data with chardetng 1.0.0 and encoding_rs 0.8.42
        run: cargo run --release --locked --manifest-path tools/golden/Cargo.toml -- tools/corpus.tsv golden_data_test.mbt golden_trace_wbtest.mbt

      - name: Regenerate the tables from chardetng's data.rs
        run: |
          manifest=$(cargo metadata --locked --format-version 1 --manifest-path tools/golden/Cargo.toml \
            | python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "chardetng"))')
          python3 tools/gen_data.py "$(dirname "$manifest")/src" detector_data.mbt

      - name: Regenerate the CJK tables from the WHATWG index files
        run: |
          mkdir -p "$RUNNER_TEMP/whatwg"
          for f in index-gb18030.txt index-gb18030-ranges.txt index-big5.txt \
                   index-jis0208.txt index-jis0212.txt index-euc-kr.txt; do
            curl -fsSL -o "$RUNNER_TEMP/whatwg/$f" \
              "https://raw.githubusercontent.com/whatwg/encoding/2c3853e461afd718be198772170d024e427aee21/$f"
          done
          python3 tools/gen_index.py "$RUNNER_TEMP/whatwg" cjk_index_data.mbt

      - name: Format the generated files
        run: moon fmt

      - name: Generated files match the committed ones
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload regenerated files
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: regenerated
          path: |
            golden_data_test.mbt
            golden_trace_wbtest.mbt
            detector_data.mbt
            cjk_index_data.mbt
