name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain this repository is formatted and tested with. Update it
  # deliberately: newer releases may format code differently. Versioned
  # downloads on cli.moonbitlang.com are deleted about 60 days after release,
  # so this pin has to move forward before then.
  MOONBIT_INSTALL_VERSION: "0.10.17+093cb8f9c"

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC (Windows native backend)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Toolchain version
        run: moon version --all

      # A new installation has no registry index, which moonbitlang/x, a
      # dependency of the command-line tool, is resolved from.
      - name: Fetch the registry index
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Interface files are up to date
        shell: bash
        run: |
          moon info
          git diff --exit-code

      - name: Check wasm
        run: moon check --deny-warn --target wasm
      - name: Check wasm-gc
        run: moon check --deny-warn --target wasm-gc
      - name: Check js
        run: moon check --deny-warn --target js
      - name: Check native
        run: moon check --deny-warn --target native

      - name: Test wasm
        run: moon test --target wasm
      - name: Test wasm-gc
        run: moon test --target wasm-gc
      - name: Test js
        run: moon test --target js
      - name: Test native
        run: moon test --target native

      - name: Command-line tool on every backend
        shell: bash
        run: |
          mkdir cli-samples
          printf 'Ke\xEF som ju uvidel, zamrelo mi srdce.' > cli-samples/sk.txt
          printf '\xEF\xBB\xBFname,city\n' > cli-samples/bom.csv
          printf 'plain ascii\n' > cli-samples/ascii.txt
          printf '\x1B$B$3$s$K$A$O\x1B(B' > cli-samples/jis.txt
          printf '<meta charset="Shift_JIS"><p>\x82\xB1\x82\xF1</p>' > cli-samples/page.html
          printf '<?xml version="1.0" encoding="windows-1251"?>\n<rss/>' > cli-samples/feed.xml
          printf 'Ke\xC4\x8F som ju uvidel, zamrelo mi srdce.' > cli-samples/sk.utf8.expected
          printf 'ok \x81\x20 bad' > cli-samples/bad.txt
          printf '%s\n' \
            'cli-samples/sk.txt: ISO-8859-4' \
            'cli-samples/bom.csv: UTF-8 (byte order mark)' \
            'cli-samples/ascii.txt: UTF-8 (ASCII only)' \
            'cli-samples/jis.txt: ISO-2022-JP' \
            'cli-samples/sk.txt: windows-1250' \
            'cli-samples/ascii.txt: windows-1250 (ASCII only)' \
            'cli-samples/sk.txt: windows-1250 (--charset)' \
            'cli-samples/page.html: Shift_JIS (declared)' \
            'cli-samples/feed.xml: windows-1251 (declared)' \
            'cli-samples/feed.xml: KOI8-R (--charset)' \
            'cli-samples/sk.txt: windows-1250' \
            'cli-samples/sk.utf8.txt: UTF-8 (converted from cli-samples/sk.txt)' > cli-samples/expected
          for target in wasm wasm-gc js native; do
            echo "::group::$target"
            rm -f cli-samples/sk.utf8.txt cli-samples/bad.utf8.txt
            {
              moon run cmd/main --target "$target" -- cli-samples/sk.txt \
                cli-samples/bom.csv cli-samples/ascii.txt cli-samples/jis.txt
              moon run cmd/main --target "$target" -- --tld sk --deny-utf8 \
                cli-samples/sk.txt cli-samples/ascii.txt
              moon run cmd/main --target "$target" -- --charset windows-1250 cli-samples/sk.txt
              moon run cmd/main --target "$target" -- --html cli-samples/page.html
              moon run cmd/main --target "$target" -- --xml cli-samples/feed.xml
              moon run cmd/main --target "$target" -- --xml --charset koi8-r cli-samples/feed.xml
              moon run cmd/main --target "$target" -- --tld sk -o cli-samples/sk.utf8.txt cli-samples/sk.txt
            } > cli-samples/actual
            diff --strip-trailing-cr cli-samples/expected cli-samples/actual
            cmp cli-samples/sk.utf8.expected cli-samples/sk.utf8.txt
            # A file that is not valid in its encoding is not converted, with
            # exit status 1.
            status=0
            moon run cmd/main --target "$target" -- --charset gbk -o cli-samples/bad.utf8.txt \
              cli-samples/bad.txt > cli-samples/error 2>&1 || status=$?
            cat cli-samples/error
            test "$status" -eq 1
            grep -q "cli-samples/bad.txt: error: invalid GBK: malformed sequence of 1 byte at offset 3 (81)" \
              cli-samples/error
            test ! -e cli-samples/bad.utf8.txt
            # A file that cannot be read is reported, with exit status 1.
            status=0
            moon run cmd/main --target "$target" -- cli-samples/missing.txt \
              > cli-samples/error 2>&1 || status=$?
            cat cli-samples/error
            test "$status" -eq 1
            grep -q "cli-samples/missing.txt: error:" cli-samples/error
            echo "::endgroup::"
          done

  generated-data:
    name: Generated data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # html-encoding-sniffer 7.0.0 needs Node.js 22.13 or later.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Download the WHATWG Encoding Standard files
        run: |
          mkdir -p "$RUNNER_TEMP/whatwg"
          base=https://raw.githubusercontent.com/whatwg/encoding/2c3853e461afd718be198772170d024e427aee21
          curl -fsSL -o "$RUNNER_TEMP/whatwg/encodings.json" "$base/encodings.json"
          for f in gb18030 gb18030-ranges big5 jis0208 jis0212 euc-kr ibm866 \
                   iso-8859-2 iso-8859-3 iso-8859-4 iso-8859-5 iso-8859-6 iso-8859-7 \
                   iso-8859-8 iso-8859-10 iso-8859-13 iso-8859-14 iso-8859-15 \
                   iso-8859-16 koi8-r koi8-u macintosh windows-874 windows-1250 \
                   windows-1251 windows-1252 windows-1253 windows-1254 windows-1255 \
                   windows-1256 windows-1257 windows-1258 x-mac-cyrillic; do
            curl -fsSL -o "$RUNNER_TEMP/whatwg/index-$f.txt" "$base/index-$f.txt"
          done

      - name: Regenerate the golden data with chardetng 1.0.0 and encoding_rs 0.8.42
        run: |
          cargo run --release --locked --manifest-path tools/golden/Cargo.toml -- \
            tools/corpus.tsv golden_data_test.mbt golden_trace_wbtest.mbt \
            "$RUNNER_TEMP/whatwg/encodings.json" golden_labels_test.mbt decode_data_test.mbt

      - name: Regenerate the tables from chardetng's data.rs
        run: |
          manifest=$(cargo metadata --locked --format-version 1 --manifest-path tools/golden/Cargo.toml \
            | python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "chardetng"))')
          python3 tools/gen_data.py "$(dirname "$manifest")/src" detector_data.mbt

      - name: Regenerate the decoding tables and the labels from the WHATWG files
        run: |
          python3 tools/gen_index.py "$RUNNER_TEMP/whatwg" cjk_index_data.mbt single_byte_index_data.mbt
          python3 tools/gen_labels.py "$RUNNER_TEMP/whatwg/encodings.json" label_data.mbt

      - name: Regenerate the prescan data with html-encoding-sniffer 7.0.0
        run: |
          mkdir -p "$RUNNER_TEMP/html5lib" "$RUNNER_TEMP/wpt/support"
          for f in tests1.dat tests2.dat; do
            curl -fsSL -o "$RUNNER_TEMP/html5lib/$f" \
              "https://raw.githubusercontent.com/html5lib/html5lib-tests/c777c408b61078ea2eb4acefc2535f54dbc8b28a/encoding/$f"
          done
          wpt=https://raw.githubusercontent.com/web-platform-tests/wpt/cf0642a4d2a851574afd696f566987f84f92849f/html/syntax/xmldecl
          for f in xmldecl-1.html xmldecl-2.html; do
            curl -fsSL -o "$RUNNER_TEMP/wpt/$f" "$wpt/$f"
          done
          # The documents the two pages load; main.mjs checks the hashes.
          for f in $(grep -oh 'src="support/[^"]*\.htm"' "$RUNNER_TEMP"/wpt/xmldecl-*.html \
                     | sed 's/^src="support\///; s/"$//' | grep -v -- '-trail\.htm$'); do
            curl -fsSL -o "$RUNNER_TEMP/wpt/support/$f" "$wpt/support/$f"
          done
          npm ci --prefix tools/sniffer --ignore-scripts --no-audit --no-fund
          node tools/sniffer/main.mjs "$RUNNER_TEMP/html5lib" "$RUNNER_TEMP/wpt" prescan_data_test.mbt

      # With the Python of the runner and its expat, whose version the tool
      # prints.
      - name: Regenerate the XML declaration data with expat
        run: python3 tools/gen_xml_data.py "$RUNNER_TEMP/whatwg/encodings.json" xml_data_test.mbt

      - name: Format the generated files
        run: moon fmt

      - name: Generated files match the committed ones
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload regenerated files
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: regenerated
          path: |
            golden_data_test.mbt
            golden_trace_wbtest.mbt
            golden_labels_test.mbt
            decode_data_test.mbt
            detector_data.mbt
            cjk_index_data.mbt
            single_byte_index_data.mbt
            label_data.mbt
            prescan_data_test.mbt
            xml_data_test.mbt
