[package]
name = "mbchardet-golden"
version = "0.0.0"
edition = "2021"
publish = false
description = "Writes the golden test data: chardetng's scores and guesses, what encoding_rs decodes and finds for labels, and the inputs of chardetng's own tests"

[dependencies]
chardetng = { version = "=1.0.0", features = ["testing-only-no-semver-guarantees-do-not-use"] }
# What chardetng's tests use to split off Vietnamese tones.
detone = "=1.0.0"
encoding_rs = "0.8.29"
